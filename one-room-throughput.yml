config:
  target: 'https://liveschats.store'
  phases:
    - duration: 60
      arrivalCount: 10
  socketio:
    path: '/socket.io/'
  processor: './auth-processor.js'

  payload:
    path: './testusers_1_1000.csv'
    fields: [loginId, loginPassword]
    order: sequence
    skipHeader: true

  variables:
    roomCount: 10 # 공통 값만 남김

scenarios:
  - name: '10 users x 10 rooms (round-robin chat)'
    engine: socketio
    flow:
      - post:
          url: '/api/users/login'
          json:
            loginId: '{{ loginId }}' # payload에서 옴
            loginPassword: '{{ loginPassword }}'
          capture:
            - json: '$.accessToken'
              as: accessToken
      - function: 'setupRooms'

      - loop:
          - namespace: '/chat'
            emit:
              channel: 'joinRoom'
              data:
                youtubeStreamId: '{{ $loopElement }}'
                token: '{{ accessToken }}'
          - think: 0.05
        over: 'rooms'

      - function: 'initCursor'
      - loop:
          - function: 'pickNextRoom'
          - function: 'setNow'
          - namespace: '/chat'
            emit:
              channel: 'chat'
              data:
                youtubeStreamId: '{{ currentRoom }}'
                message: 'user {{ loginId }} -> room {{ currentRoom }} at {{ nowISO }}'
                token: '{{ accessToken }}'
          - think: 2
        count: 999999
