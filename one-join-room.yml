config:
  target: 'http://ec2-3-37-89-9.ap-northeast-2.compute.amazonaws.com:3000'
  phases:
    - duration: 5 # 5초 동안
      arrivalCount: 10000 # 10000명 접속
  socketio:
    path: '/socket.io'
  processor: './auth-processor.js'

  payload:
    path: './users.csv' # 필요 시 payload 파일 경로 지정
    fields:
      - loginId
      - loginPassword
    order: sequence
    skipHeader: true
  variables:
    roomCount: 1000 # 방 개수
    holdMs: 15000 # 방에 머무는 시간(2초)
    syncDelayMs: 0

scenarios:
  - name: '유저 한명이 10개 채팅방 접속'
    engine: socketio
    flow:
      # 1) 로그인 & 토큰 캡처
      - post:
          url: '/api/users/login'
          json:
            loginId: '{{ loginId }}'
            loginPassword: '{{ loginPassword }}'
          capture:
            - json: '$.accessToken' # 응답 구조에 맞게 필요 시 수정($.data.accessToken 등)
              as: accessToken
              log: '토큰 {{ accessToken }}'

      # 2) 1..roomCount 배열 만들기
      - function: 'setupRooms'

      # 3) 모든 방에 한 번씩 joinRoom
      - loop:
          - namespace: '/chat'
            emit:
              channel: 'joinRoom'
              data:
                youtubeStreamId: '{{ $loopElement }}'
                token: '{{ accessToken }}'
          - think: 0.01 # 폭주 방지용(선택)
        over: 'rooms' # setupRooms가 만든 배열

      - namespace: '/chat'
        emit:
          channel: 'joinRoom'
          data:
            youtubeStreamId: '{{ targetRoomId }}'
            token: '{{ accessToken }}'
      - function: 'hold' # 현재 방 설정
      - namespace: '/chat'
        emit:
          channel: 'leaveRoom'
          data:
            youtubeStreamId: '{{ targetRoomId }}'
      # 4) 2초마다 다음 방으로 chat (무한 루프)
      - function: 'initCursor'
      - function: 'setNow' # currentRoom 설정
      - loop:
          - function: 'pickNextRoom' # currentRoom 설정
          - namespace: '/chat'
            emit:
              channel: 'chat'
              data:
                youtubeStreamId: '{{ currentRoom }}'
                message: 'RR {{ loginId }} chat to room {{ currentRoom }} at {{ nowISO }}'
                token: '{{ accessToken }}'
          - think: 0.01 # 2초마다 한 건
        count: 100

      #count를 생략하면 무한 반복됨(테스트 duration 동안). :contentReference[oaicite:1]{index=1}
